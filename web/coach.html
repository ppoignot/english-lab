<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FFFBF7"><title>Suivi de Pierre-Olivier · anglais</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="mobile.css"></head><body>
<p id="boot" style="text-align:center;margin-top:30vh;font-weight:800;color:#B8400F">Chargement du suivi…</p>
<script>window.EL_MODE="coach";</script><script src="config.js"></script><script src="adapters.js"></script>
<script>
(async()=>{
  const k=new URLSearchParams(location.search).get("k");let rows=[];
  try{rows=k?await EL_AUTH.coachSnapshot(k):[]}catch(e){console.warn(e)}
  const data={};let at=0;(rows||[]).forEach(r=>{(data[r.coll]=data[r.coll]||{})[r.id]=r.data;at=Math.max(at,Date.parse(r.at)||0)});
  window.EL_SNAP={at,data};
  for(const f of ["app.js","memovis.js","mobile.js"])await new Promise((res,rej)=>{const s=document.createElement("script");s.src=f;s.onload=res;s.onerror=rej;document.body.appendChild(s)});
})();
</script>
</body></html>
